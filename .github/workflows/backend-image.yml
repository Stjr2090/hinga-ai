name: Build application images

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/backend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint --workspace frontend
      - run: npm test --workspace frontend
      - run: npm run lint --workspace backend
      - run: npm test --workspace backend

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name hingaaiacr

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            hingaaiacr.azurecr.io/hinga-backend:${{ github.sha }}
            hingaaiacr.azurecr.io/hinga-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://hinga-backend.wittyplant-ea872425.italynorth.azurecontainerapps.io
          tags: |
            hingaaiacr.azurecr.io/hinga-frontend:${{ github.sha }}
            hingaaiacr.azurecr.io/hinga-frontend:latest
