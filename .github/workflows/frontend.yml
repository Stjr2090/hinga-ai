name: Frontend CI and deploy

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/frontend.yml
  workflow_dispatch:

concurrency:
  group: hinga-frontend-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: hinga-ai-student-rg
  AZURE_CONTAINER_APP: hinga-frontend
  AZURE_REGISTRY: hingaaiacr
  IMAGE: hingaaiacr.azurecr.io/hinga-frontend
  VITE_API_BASE_URL: https://hinga-backend.wittyplant-ea872425.italynorth.azurecontainerapps.io

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend types
        run: npm run lint --workspace frontend

      - name: Test frontend
        run: npm test --workspace frontend

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$AZURE_REGISTRY"

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy frontend image
        shell: bash
        run: |
          REVISION_SUFFIX="sha-${GITHUB_SHA:0:7}-${GITHUB_RUN_ATTEMPT}"
          echo "REVISION_SUFFIX=$REVISION_SUFFIX" >> "$GITHUB_ENV"
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE:$GITHUB_SHA" \
            --revision-suffix "$REVISION_SUFFIX" \
            --only-show-errors \
            --output none

      - name: Verify deployed frontend image
        shell: bash
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub SHA is not a full 40-character lowercase hexadecimal value."
            exit 1
          fi

          EXPECTED_REVISION="${AZURE_CONTAINER_APP}--${REVISION_SUFFIX}"
          EXPECTED_IMAGE="${IMAGE}:${GITHUB_SHA}"
          REVISION_DATA=""

          for attempt in {1..12}; do
            if REVISION_DATA="$(timeout 15s az containerapp revision show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$EXPECTED_REVISION" \
              --query '[properties.template.containers[0].image, properties.provisioningState, properties.healthState, properties.active]' \
              --output tsv \
              --only-show-errors 2>/dev/null)"; then
              break
            fi

            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done

          if [[ -z "$REVISION_DATA" ]]; then
            echo "Expected revision was not registered within the bounded verification period: $EXPECTED_REVISION"
            exit 1
          fi

          mapfile -t REVISION_FIELDS <<< "$REVISION_DATA"
          DEPLOYED_IMAGE="${REVISION_FIELDS[0]:-}"
          PROVISIONING_STATE="${REVISION_FIELDS[1]:-unknown}"
          HEALTH_STATE="${REVISION_FIELDS[2]:-unknown}"
          ACTIVE_STATE="${REVISION_FIELDS[3]:-unknown}"
          DEPLOYED_TAG="${DEPLOYED_IMAGE##*:}"

          if [[ "$DEPLOYED_TAG" == "latest" || ! "$DEPLOYED_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Deployed image does not use an immutable full Git SHA tag."
            exit 1
          fi

          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "Deployed image does not match the image built by this workflow."
            exit 1
          fi

          echo "Verified revision: $EXPECTED_REVISION"
          echo "Verified immutable image: $DEPLOYED_IMAGE"
          echo "Provisioning state: $PROVISIONING_STATE"
          echo "Health state: $HEALTH_STATE"
          echo "Active: $ACTIVE_STATE"

      - name: Verify frontend health
        shell: bash
        run: |
          URL="https://hinga-frontend.wittyplant-ea872425.italynorth.azurecontainerapps.io/health"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$URL"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
